name: CI

on:
  push:
    branches: [main]
  pull_request:

# Validation only: the workflow reads the repository and never writes to it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Playwright config uses CI for forbidOnly, retries, and worker count.
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Keeps CI on the same major as .nvmrc (Node 22 LTS).
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        # Installs the browser build matching the version in package-lock.json.
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        # The Playwright webServer rebuilds and serves the production bundle on
        # 127.0.0.1:4173, so this exercises the real SPA fallback rather than the
        # dev server.
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
